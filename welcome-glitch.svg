<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120">
  <style>
    .bg { fill: #0d0d0d; stroke: #ff073a; stroke-width: 2; }
    .t { font: 700 28px 'Courier New', monospace; letter-spacing: 4px; text-anchor: middle; }
    .main { fill: #ffffff; }
    .r { fill: #ff073a; opacity: .85; animation: gr 2.4s infinite steps(1); }
    .c { fill: #00f0ff; opacity: .7; animation: gc 2.4s infinite steps(1); }
    .scan { fill: url(#lines); opacity: .25; }
    .glow { animation: pulse 2s ease-in-out infinite; }
    @keyframes gr { 0%{transform:translate(0,0)} 10%{transform:translate(-4px,2px)} 12%{transform:translate(3px,-2px)} 14%{transform:translate(0,0)} 60%{transform:translate(5px,1px)} 62%{transform:translate(0,0)} }
    @keyframes gc { 0%{transform:translate(0,0)} 10%{transform:translate(4px,-2px)} 12%{transform:translate(-3px,2px)} 14%{transform:translate(0,0)} 60%{transform:translate(-5px,-1px)} 62%{transform:translate(0,0)} }
    @keyframes pulse { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:.35} }
  </style>
  <defs>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000"/>
    </pattern>
  </defs>
  <rect class="bg glow" x="2" y="2" width="856" height="116" rx="10"/>
  <text class="t c" x="430" y="72">WELCOME_TO_THE_LONEWOLF37_DEN</text>
  <text class="t r" x="430" y="72">WELCOME_TO_THE_LONEWOLF37_DEN</text>
  <text class="t main" x="430" y="72">WELCOME_TO_THE_LONEWOLF37_DEN</text>
  <rect class="scan" x="2" y="2" width="856" height="116" rx="10"/>
</svg>
